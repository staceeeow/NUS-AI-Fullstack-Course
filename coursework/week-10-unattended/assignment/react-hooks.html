<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Week 10 - Events, Hooks & Fetch</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
  section { margin-bottom: 40px; }
  .color-box { width: 100px; height: 100px; border: 1px solid #ccc; margin-top: 10px; }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect } = React;

// Task 1: Handling Events in React
function ToggleMessage() {
  const [show, setShow] = useState(false);

  return (
    <section>
      <h2>1. Toggle Message</h2>
      <button onClick={() => setShow(!show)}>Toggle Message</button>
      {show && <p>Hello, welcome to React!</p>}
    </section>
  );
}

// Task 2: State Management using React Hooks
function ColorChanger() {
  const [color, setColor] = useState("");

  return (
    <section>
      <h2>2. Color Changer</h2>
      <input
        type="text"
        placeholder="Enter a colour name (e.g. blue)"
        value={color}
        onChange={(e) => setColor(e.target.value)}
      />
      <div className="color-box" style={{ backgroundColor: color }}></div>
    </section>
  );
}

// Task 3: Asynchronous Data Fetching with AJAX
function UserProfile() {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    fetch("https://jsonplaceholder.typicode.com/users/1")
      .then((res) => res.json())
      .then((data) => {
        setUser(data);
        setLoading(false);
      });
  }, []);

  if (loading) {
    return (
      <section>
        <h2>3. User Profile</h2>
        <p>Loading...</p>
      </section>
    );
  }

  return (
    <section>
      <h2>3. User Profile</h2>
      <p><strong>Name:</strong> {user.name}</p>
      <p><strong>Email:</strong> {user.email}</p>
      <p><strong>Address:</strong> {user.address.street}, {user.address.city}</p>
    </section>
  );
}

function App() {
  return (
    <div>
      <ToggleMessage />
      <ColorChanger />
      <UserProfile />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
