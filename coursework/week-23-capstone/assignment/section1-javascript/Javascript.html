<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI-Powered LMS - JavaScript</title>
<style>
  body { font-family: sans-serif; max-width: 500px; margin: 40px auto; }
  section { margin-bottom: 40px; }
  .error { color: #c0392b; }
  .success { color: #27ae60; }
  input { padding: 6px; width: 100%; box-sizing: border-box; margin-bottom: 8px; }
</style>
</head>
<body>

<!-- Email Validation -->
<section>
  <h2>Sign Up</h2>
  <form id="signupForm">
    <label for="email">Email</label>
    <input type="text" id="email" name="email" placeholder="you@example.com">
    <button type="submit">Sign Up</button>
  </form>
  <p id="emailMessage"></p>
</section>

<!-- Input Event Handling -->
<section>
  <h2>Live Preview</h2>
  <label for="courseName">Course Name</label>
  <input type="text" id="courseName" placeholder="Type a course name...">
  <p>You are viewing: <strong id="coursePreview">(nothing yet)</strong></p>
</section>

<script>
  // Email validation: checks for "@", updates the DOM, handles form submit
  const form = document.getElementById("signupForm");
  const emailInput = document.getElementById("email");
  const emailMessage = document.getElementById("emailMessage");

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const email = emailInput.value.trim();

    if (email.includes("@")) {
      emailMessage.textContent = "Signed up successfully with " + email;
      emailMessage.className = "success";
    } else {
      emailMessage.textContent = "Please enter a valid email address (must contain '@').";
      emailMessage.className = "error";
    }
  });

  // Input event handling: updates the preview dynamically as the user types
  const courseNameInput = document.getElementById("courseName");
  const coursePreview = document.getElementById("coursePreview");

  courseNameInput.addEventListener("input", (event) => {
    const value = event.target.value.trim();
    coursePreview.textContent = value === "" ? "(nothing yet)" : value;
  });
</script>

</body>
</html>
